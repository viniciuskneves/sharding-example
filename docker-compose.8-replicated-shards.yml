# Compose file for demo 8 (replicated shards): one router in front of SIX
# storage nodes, plus the load tester.
#
# The six nodes form three shards of two replicas each:
#
#   shard a: shard-a1, shard-a2
#   shard b: shard-b1, shard-b2
#   shard c: shard-c1, shard-c2
#
# A key belongs to one shard (by hash) and is stored on BOTH nodes of it.
#
# One thing can be changed from your shell: WRITES_NEED, which says how many
# replicas of a shard must store a write for it to count ("one" or "all").
#
# This is not the default compose file name, so every command needs "-f":
#
# Start:           docker compose -f docker-compose.8-replicated-shards.yml up -d --force-recreate
# Strict writes:   WRITES_NEED=all docker compose -f docker-compose.8-replicated-shards.yml up -d router
# Kill a replica:  docker compose -f docker-compose.8-replicated-shards.yml stop shard-b1
# Bring it back:   docker compose -f docker-compose.8-replicated-shards.yml start shard-b1
# Repair:          curl -X POST localhost:8000/repair
# Stop:            docker compose -f docker-compose.8-replicated-shards.yml down
#
# Do not run this together with the compose files of the other demos: they
# all use the host ports 8000 and up.

# Shared settings for every storage node. Compose ignores top-level keys that
# start with "x-", so this block only exists to be reused: "&shard" names it,
# and "<<: *shard" below pastes it into each service.
x-shard: &shard
  # Official Node.js 22 image on Alpine Linux (small). The code has no
  # dependencies, so there is nothing to install and no Dockerfile to build.
  image: node:22-alpine
  # The process the container runs.
  command: node /app/shard.js
  # Mount shard.js from this folder into the container, read-only (":ro").
  volumes:
    - ./shard.js:/app/shard.js:ro

# The two artificial limits of a node (see shard.js). Kept in one place so
# every node is guaranteed to have the same ones.
x-limits: &limits
  # Room for 1000 keys per node.
  MAX_KEYS: 1000
  # 5 ms per write -> at most 200 writes per second.
  WRITE_COST_MS: 5

services:
  router:
    image: node:22-alpine
    command: node /app/router.js
    volumes:
      - ./router.js:/app/router.js:ro
    environment:
      # Sharding and replication together: a key belongs to one shard, picked
      # by hash(key) % number of shards, and is stored on every replica of it.
      STRATEGY: replicated
      # The shards and their replicas: ";" separates shards, "," separates
      # the replicas of one shard. (">-" lets the value run over several
      # lines; YAML joins them with spaces, which the router ignores.)
      SHARD_GROUPS: >-
        http://shard-a1:8000,http://shard-a2:8000;
        http://shard-b1:8000,http://shard-b2:8000;
        http://shard-c1:8000,http://shard-c2:8000
      # How many replicas of a shard must store a write for it to count.
      # Taken from your shell when you run "docker compose up"; "one" if unset.
      #   one -> at least one: writes go on while a replica is down
      #   all -> every one: a replica that is down blocks writes to its shard
      WRITES_NEED: ${WRITES_NEED:-one}
    # host:container. The router is http://localhost:8000 on your machine.
    # It is the only address a client needs.
    ports: ["8000:8000"]

  # Six identical nodes. The names say how the router groups them: shard-a1
  # and shard-a2 are the two replicas of shard a, and so on. To the nodes
  # themselves this means nothing: each one is a plain single-node store that
  # knows of no other node.
  shard-a1:
    <<: *shard
    environment:
      # Label the node puts in every response.
      NODE_NAME: shard-a1
      <<: *limits
    # Published only so you can look at one node directly, e.g.
    # curl localhost:8001/status. Clients are meant to use the router.
    ports: ["8001:8000"]

  shard-a2:
    <<: *shard
    environment:
      NODE_NAME: shard-a2
      <<: *limits
    ports: ["8002:8000"]

  shard-b1:
    <<: *shard
    environment:
      NODE_NAME: shard-b1
      <<: *limits
    ports: ["8003:8000"]

  shard-b2:
    <<: *shard
    environment:
      NODE_NAME: shard-b2
      <<: *limits
    ports: ["8004:8000"]

  shard-c1:
    <<: *shard
    environment:
      NODE_NAME: shard-c1
      <<: *limits
    ports: ["8005:8000"]

  shard-c2:
    <<: *shard
    environment:
      NODE_NAME: shard-c2
      <<: *limits
    ports: ["8006:8000"]

  # oha, the load-testing CLI, packaged as a container so you do not have to
  # install it. It runs inside the Compose network, which is why it addresses
  # the router as http://router:8000 rather than localhost.
  oha:
    image: ghcr.io/hatoo/oha:1.17.0
    # A profile keeps this service out of "docker compose up": it is not a
    # server, it only runs on demand with "docker compose run --rm oha ...".
    profiles: [tools]
