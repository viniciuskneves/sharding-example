# Compose file for demo 5 (directory-based sharding): one router in front of
# FOUR storage nodes, plus the load tester.
#
# Three of the nodes are ordinary shards and share the keys by hash, as in
# demo 3. The fourth, shard-d, owns no keys by hash: it stays empty until a
# key is moved there by hand through the router's directory.
#
# One thing can be changed from your shell: how fast shard-d writes, with
# SHARD_D_WRITE_COST_MS. That is how the demo gives the node that holds a hot
# key a faster machine than the rest.
#
# This is not the default compose file name, so every command needs "-f":
#
# Start:          docker compose -f docker-compose.5-directory.yml up -d --force-recreate
# Fast shard-d:   SHARD_D_WRITE_COST_MS=2 docker compose -f docker-compose.5-directory.yml up -d --force-recreate
# Move a key:     curl -X PUT -d shard-d localhost:8000/directory/user-1500
# List moved:     curl localhost:8000/directory
# Forget it all:  docker compose -f docker-compose.5-directory.yml restart router
# Stop:           docker compose -f docker-compose.5-directory.yml down
#
# Do not run this together with the compose files of the other demos: they
# all use the same service names and the host ports 8000 to 8004.

# Shared settings for every storage node. Compose ignores top-level keys that
# start with "x-", so this block only exists to be reused: "&shard" names it,
# and "<<: *shard" below pastes it into each service.
x-shard: &shard
  # Official Node.js 22 image on Alpine Linux (small). The code has no
  # dependencies, so there is nothing to install and no Dockerfile to build.
  image: node:22-alpine
  # The process the container runs.
  command: node /app/shard.js
  # Mount shard.js from this folder into the container, read-only (":ro").
  volumes:
    - ./shard.js:/app/shard.js:ro

# The two artificial limits of a node (see shard.js). Kept in one place so
# every node is guaranteed to have the same ones.
x-limits: &limits
  # Room for 1000 keys per node.
  MAX_KEYS: 1000
  # 5 ms per write -> at most 200 writes per second.
  WRITE_COST_MS: 5

services:
  router:
    image: node:22-alpine
    command: node /app/router.js
    volumes:
      - ./router.js:/app/router.js:ro
    environment:
      # "directory" is sharding by hash, exactly like "modulo", plus a
      # table of exceptions kept by the router: keys that were moved by hand,
      # and the node each one was moved to.
      STRATEGY: directory
      # The shards that share the keys by hash.
      NODES: http://shard-a:8000,http://shard-b:8000,http://shard-c:8000
      # A node that owns no keys by hash. It only ever holds keys that the
      # directory sends there.
      DIRECTORY_ONLY_NODES: http://shard-d:8000
    # host:container. The router is http://localhost:8000 on your machine.
    # It is the only address a client needs.
    ports: ["8000:8000"]

  # The service name doubles as the hostname the router uses to reach a node.
  shard-a:
    <<: *shard
    environment:
      # Label the node puts in every response.
      NODE_NAME: shard-a
      <<: *limits
    # Published only so you can look at one node directly, e.g.
    # curl localhost:8001/status. Clients are meant to use the router.
    ports: ["8001:8000"]

  shard-b:
    <<: *shard
    environment:
      NODE_NAME: shard-b
      <<: *limits
    ports: ["8002:8000"]

  shard-c:
    <<: *shard
    environment:
      NODE_NAME: shard-c
      <<: *limits
    ports: ["8003:8000"]

  shard-d:
    <<: *shard
    environment:
      NODE_NAME: shard-d
      <<: *limits
      # Replaces the WRITE_COST_MS that "<<: *limits" just pasted in, for this
      # node only. Taken from your shell when you run "docker compose up";
      # 5 ms if unset, the same as every other node. With 2 ms this node can
      # do 500 writes per second instead of 200.
      WRITE_COST_MS: ${SHARD_D_WRITE_COST_MS:-5}
    ports: ["8004:8000"]

  # oha, the load-testing CLI, packaged as a container so you do not have to
  # install it. It runs inside the Compose network, which is why it addresses
  # the router as http://router:8000 rather than localhost.
  oha:
    image: ghcr.io/hatoo/oha:1.17.0
    # A profile keeps this service out of "docker compose up": it is not a
    # server, it only runs on demand with "docker compose run --rm oha ...".
    profiles: [tools]
